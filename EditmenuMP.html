<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Menu Outlet RPL</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff;
            padding: 20px;
        }

        h1 {
            font-weight: bold;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            background-color: #e0e0e0; /* Warna latar belakang input */
            border: none;
            border-radius: 4px;
        }

        .button {
            width: 100%;
            padding: 15px;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .button a {
            text-decoration: none;
            color: white;
        }

        .simpan {
            background-color: #4CAF50; /* Warna hijau */
        }

        .batal {
            background-color: #f44336; /* Warna merah */
        }
    </style>
</head>
<body>

    <h1>Edit Menu Outlet MP</h1>

    <div class="form-group">
        <label for="nama-menu">Nama Menu</label>
        <input type="text" id="nama-menu" placeholder="Masukkan nama menu">
    </div>

    <div class="form-group">
        <label for="harga">Harga</label>
        <input type="text" id="harga" placeholder="Masukkan harga">
    </div>

    <button class="button simpan">Simpan</button>
    <button class="button batal"><a href="EditoutletMP.html">Batal</a></button>

</body>
</html>
